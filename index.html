<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>B & P Wedding Gallery</title>

<style>
  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  body {
    font-family: Arial, sans-serif;
  }

  /* ==============================
     MAIN SLIDER
  ============================== */

  .slider {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;
    background: transparent;
    user-select: none;
    touch-action: pan-y;
  }

  .slides {
    display: flex;
    width: 100%;
    height: 100%;
    transition: transform 0.55s ease;
  }

  .slide {
    flex: 0 0 100%;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .slide img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    object-position: center;
    display: block;

    /* ป้องกันการลากรูป */
    pointer-events: none;
    -webkit-user-drag: none;
  }


  /* ==============================
     ARROWS
  ============================== */

  .arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);

    width: 44px;
    height: 44px;

    border: none;
    border-radius: 50%;

    background: rgba(0, 0, 0, 0.28);
    color: white;

    font-size: 25px;
    font-weight: 300;

    display: flex;
    align-items: center;
    justify-content: center;

    cursor: pointer;

    z-index: 20;

    transition:
      background 0.25s ease,
      transform 0.25s ease;
  }

  .arrow:hover {
    background: rgba(0, 0, 0, 0.50);
  }

  .arrow:active {
    transform: translateY(-50%) scale(0.92);
  }

  .prev {
    left: 16px;
  }

  .next {
    right: 16px;
  }


  /* ==============================
     DOTS
  ============================== */

  .dots {
    position: absolute;

    left: 50%;
    bottom: 16px;

    transform: translateX(-50%);

    display: flex;
    align-items: center;
    justify-content: center;

    gap: 7px;

    padding: 7px 11px;

    border-radius: 20px;

    background: rgba(0, 0, 0, 0.15);

    z-index: 20;
  }

  .dot {
    width: 7px;
    height: 7px;

    border-radius: 50%;

    background: rgba(255, 255, 255, 0.55);

    cursor: pointer;

    transition:
      transform 0.25s ease,
      background 0.25s ease;
  }

  .dot.active {
    background: white;
    transform: scale(1.35);
  }


  /* ==============================
     MOBILE
  ============================== */

  @media (max-width: 600px) {

    .arrow {
      width: 38px;
      height: 38px;

      font-size: 22px;
    }

    .prev {
      left: 10px;
    }

    .next {
      right: 10px;
    }

    .dots {
      bottom: 10px;
      gap: 5px;
      padding: 6px 9px;
    }

    .dot {
      width: 6px;
      height: 6px;
    }
  }

</style>
</head>


<body>

<div class="slider" id="slider">

  <div class="slides" id="slides"></div>

  <button
    class="arrow prev"
    id="prev"
    aria-label="Previous image">
    &#10094;
  </button>

  <button
    class="arrow next"
    id="next"
    aria-label="Next image">
    &#10095;
  </button>

  <div
    class="dots"
    id="dots">
  </div>

</div>


<script>

/* =====================================================
   ตั้งค่ารูปตรงนี้อย่างเดียว
===================================================== */

const images = [
  "BP01.jpg",
  "BP02.jpg",
  "BP03.jpg",
  "BP04.jpg",
  "BP05.jpg",
  "BP06.jpg",
  "BP07.jpg",
  "BP08.jpg",
  "BP09.jpg",
  "BP10.jpg",
  "BP11.jpg",
  "BP12.jpg",
  "BP13.jpg",
  "BP14.jpg",
  "BP15.jpg",
  "BP16.jpg",
  "BP17.jpg",
  "BP18.jpg",
  "BP19.jpg",
  "BP20.jpg"
];


/* =====================================================
   SETTINGS
===================================================== */

// Auto Slide ทุก 5 วินาที
const AUTO_SLIDE_TIME = 5000;

// หลังผู้ใช้กดหรือปัด
// รอ 10 วินาที ก่อนเริ่ม Auto Slide ใหม่
const RESUME_TIME = 10000;


/* =====================================================
   VARIABLES
===================================================== */

const slider =
  document.getElementById("slider");

const slidesContainer =
  document.getElementById("slides");

const dotsContainer =
  document.getElementById("dots");

const prevButton =
  document.getElementById("prev");

const nextButton =
  document.getElementById("next");


let currentIndex = 0;

let autoSlideTimer;

let resumeTimer;

let touchStartX = 0;

let touchStartY = 0;

let touchEndX = 0;

let touchEndY = 0;


/* =====================================================
   CREATE IMAGES
===================================================== */

images.forEach((image, index) => {

  /* Slide */

  const slide =
    document.createElement("div");

  slide.className = "slide";


  const img =
    document.createElement("img");

  img.src = image;

  img.alt =
    "Wedding photo " + (index + 1);


  /* โหลดรูปแรกทันที
     รูปอื่น Lazy Load */

  if (index === 0) {

    img.loading = "eager";

    img.fetchPriority = "high";

  } else {

    img.loading = "lazy";

  }


  slide.appendChild(img);

  slidesContainer.appendChild(slide);


  /* Dot */

  const dot =
    document.createElement("span");

  dot.className = "dot";

  dot.addEventListener(
    "click",
    function() {

      goToSlide(index);

      userInteraction();

    }
  );


  dotsContainer.appendChild(dot);

});


/* =====================================================
   UPDATE SLIDER
===================================================== */

function updateSlider() {

  slidesContainer.style.transform =
    `translateX(-${currentIndex * 100}%)`;


  const dots =
    document.querySelectorAll(".dot");


  dots.forEach(
    (dot, index) => {

      dot.classList.toggle(
        "active",
        index === currentIndex
      );

    }
  );


  preloadNearbyImages();

}


/* =====================================================
   GO TO SLIDE
===================================================== */

function goToSlide(index) {

  if (index >= images.length) {

    currentIndex = 0;

  }

  else if (index < 0) {

    currentIndex =
      images.length - 1;

  }

  else {

    currentIndex = index;

  }


  updateSlider();

}


/* =====================================================
   NEXT / PREVIOUS
===================================================== */

function nextSlide() {

  goToSlide(
    currentIndex + 1
  );

}


function previousSlide() {

  goToSlide(
    currentIndex - 1
  );

}


/* =====================================================
   BUTTON EVENTS
===================================================== */

nextButton.addEventListener(
  "click",
  function() {

    nextSlide();

    userInteraction();

  }
);


prevButton.addEventListener(
  "click",
  function() {

    previousSlide();

    userInteraction();

  }
);


/* =====================================================
   AUTO SLIDE
===================================================== */

function startAutoSlide() {

  stopAutoSlide();


  autoSlideTimer =
    setInterval(
      nextSlide,
      AUTO_SLIDE_TIME
    );

}


function stopAutoSlide() {

  clearInterval(
    autoSlideTimer
  );

}


/* =====================================================
   USER INTERACTION
===================================================== */

function userInteraction() {

  stopAutoSlide();


  clearTimeout(
    resumeTimer
  );


  resumeTimer =
    setTimeout(
      startAutoSlide,
      RESUME_TIME
    );

}


/* =====================================================
   TOUCH / SWIPE
===================================================== */

slider.addEventListener(
  "touchstart",
  function(event) {

    touchStartX =
      event.changedTouches[0].screenX;

    touchStartY =
      event.changedTouches[0].screenY;

    stopAutoSlide();

  },
  { passive: true }
);


slider.addEventListener(
  "touchend",
  function(event) {

    touchEndX =
      event.changedTouches[0].screenX;

    touchEndY =
      event.changedTouches[0].screenY;


    handleSwipe();

  },
  { passive: true }
);


function handleSwipe() {

  const diffX =
    touchStartX - touchEndX;

  const diffY =
    touchStartY - touchEndY;


  /*
    เช็กว่าเป็นการปัดแนวนอนจริง ๆ
    เพื่อไม่ให้รบกวนการ Scroll หน้า Canva
  */

  if (
    Math.abs(diffX) >
    Math.abs(diffY)
  ) {

    if (diffX > 45) {

      nextSlide();

    }

    else if (diffX < -45) {

      previousSlide();

    }

  }


  userInteraction();

}


/* =====================================================
   KEYBOARD SUPPORT
===================================================== */

document.addEventListener(
  "keydown",
  function(event) {

    if (event.key === "ArrowRight") {

      nextSlide();

      userInteraction();

    }


    if (event.key === "ArrowLeft") {

      previousSlide();

      userInteraction();

    }

  }
);


/* =====================================================
   PRELOAD
   โหลดรูปข้างหน้า/ข้างหลังไว้ก่อน
===================================================== */

function preloadNearbyImages() {

  const nextIndex =
    (currentIndex + 1)
    % images.length;


  const previousIndex =
    (
      currentIndex - 1
      + images.length
    )
    % images.length;


  [
    images[nextIndex],
    images[previousIndex]
  ]
  .forEach(
    function(src) {

      const image =
        new Image();

      image.src = src;

    }
  );

}


/* =====================================================
   PAUSE WHEN TAB NOT ACTIVE
===================================================== */

document.addEventListener(
  "visibilitychange",
  function() {

    if (document.hidden) {

      stopAutoSlide();

    }

    else {

      startAutoSlide();

    }

  }
);


/* =====================================================
   START
===================================================== */

updateSlider();

startAutoSlide();

</script>

</body>
</html>
```
