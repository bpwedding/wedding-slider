<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BPWedding Website | Our Gallery</title>

<style>
/* =========================
   GENERAL
========================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 0;

  background: #faf8f5;
  color: #403a36;

  font-family: Georgia, "Times New Roman", serif;

  min-height: 100vh;
}


/* =========================
   PAGE
========================= */

.page {
  width: 100%;
  max-width: 1000px;

  margin: auto;

  padding:
    45px
    20px
    35px;
}


/* =========================
   HEADER
========================= */

.header {
  text-align: center;

  margin-bottom: 28px;
}

.logo {
  font-size: 38px;

  font-style: italic;

  letter-spacing: 3px;

  margin-bottom: 8px;
}

.line {
  width: 55px;
  height: 1px;

  background: #a69b91;

  margin:
    12px
    auto
    18px;
}

.title {
  font-size: 18px;

  letter-spacing: 6px;

  font-weight: normal;

  margin: 0;
}

.subtitle {
  margin-top: 12px;

  font-family: Arial, sans-serif;

  font-size: 13px;

  letter-spacing: 1px;

  color: #888078;
}


/* =========================
   SLIDER
========================= */

.slider-wrapper {
  width: 100%;

  max-width: 900px;

  margin: auto;

  position: relative;
}

.slider {
  position: relative;

  width: 100%;

  /*
    เปลี่ยนตรงนี้ได้
    16 / 10 = ค่อนข้างเหมาะกับรูป Wedding
  */

  aspect-ratio: 16 / 10;

  overflow: hidden;

  background: #eeeae5;

  border-radius: 4px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,0.08);

  touch-action: pan-y;

  user-select: none;
}


/* =========================
   SLIDES
========================= */

.slides {
  position: relative;
  width: 100%;
  height: 100%;
}

.slide {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  opacity: 0;
  visibility: hidden;
  transition:
    opacity 1.15s ease-in-out,
    visibility 0s linear 1.15s;

  z-index: 0;
}

.slide.active {
  opacity: 1;
  visibility: visible;
  transition:
    opacity 1.15s ease-in-out,
    visibility 0s linear 0s;

  z-index: 1;
}

.slide img {
  width: 100%;
  height: 100%;

  object-fit: contain;

  display: block;

  pointer-events: none;

  -webkit-user-drag: none;
}


/* =========================
   ARROWS
========================= */

.arrow {
  position: absolute;

  top: 50%;

  transform:
    translateY(-50%);

  width: 45px;
  height: 45px;

  border: 0;

  border-radius: 50%;

  background:
    rgba(0,0,0,0.28);

  color: white;

  font-size: 24px;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;

  z-index: 10;

  transition:
    background 0.2s ease,
    transform 0.2s ease;
}

.arrow:hover {
  background:
    rgba(0,0,0,0.5);
}

.arrow:active {
  transform:
    translateY(-50%)
    scale(0.92);
}

.prev {
  left: 15px;
}

.next {
  right: 15px;
}


/* =========================
   COUNTER
========================= */

.counter {
  position: absolute;

  top: 15px;
  right: 15px;

  padding:
    6px
    11px;

  border-radius: 20px;

  background:
    rgba(0,0,0,0.30);

  color: white;

  font-family:
    Arial,
    sans-serif;

  font-size: 12px;

  letter-spacing: 1px;

  z-index: 10;
}


/* =========================
   DOTS
========================= */

.dots {
  display: flex;

  justify-content: center;

  align-items: center;

  flex-wrap: wrap;

  gap: 7px;

  margin-top: 18px;
}

.dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #d2cbc4;

  cursor: pointer;

  transition:
    all
    0.25s ease;
}

.dot.active {
  background: #514a44;

  transform:
    scale(1.4);
}


/* =========================
   FOOTER
========================= */

.footer {
  text-align: center;

  margin-top: 32px;
}

.message {
  font-style: italic;

  font-size: 15px;

  color: #7b7169;

  margin-bottom: 25px;
}


/* =========================
   BACK BUTTON
========================= */

.back-button {
  display: inline-block;

  padding:
    12px
    24px;

  border:
    1px solid
    #837970;

  color: #514a44;

  text-decoration: none;

  font-family:
    Arial,
    sans-serif;

  font-size: 11px;

  letter-spacing: 2px;

  transition:
    all
    0.25s ease;
}

.back-button:hover {
  background: #514a44;

  color: white;
}


/* =========================
   MOBILE
========================= */

@media
(max-width: 600px) {

  .page {
    padding:
      30px
      12px
      25px;
  }

  .logo {
    font-size: 31px;
  }

  .title {
    font-size: 15px;

    letter-spacing: 4px;
  }

  .subtitle {
    font-size: 11px;
  }

  .slider {
    /*
      มือถือให้รูปใหญ่ขึ้น
    */

    aspect-ratio: 4 / 5;
  }

  .arrow {
    width: 38px;
    height: 38px;

    font-size: 20px;
  }

  .prev {
    left: 8px;
  }

  .next {
    right: 8px;
  }

  .counter {
    top: 10px;
    right: 10px;
  }

}


/* =========================
   CLEAN GALLERY PROGRESS
========================= */

.dots {
  display: none !important;
}

.gallery-progress {
  width: min(240px, 58vw);
  height: 2px;
  margin: 13px auto 0;
  background: rgba(81, 74, 68, 0.18);
  overflow: hidden;
  border-radius: 999px;
}

.gallery-progress-bar {
  width: 0%;
  height: 100%;
  background: currentColor;
  opacity: 0.72;
  border-radius: inherit;
  transition: width 0.65s ease;
}


/* =========================
   BURGUNDY + CREAM THEME
========================= */

:root {
  --burgundy: #7A1F2B;
  --cream: #F7F0E6;

/* Main page */
html,
body {

/* Music button */

.music-button:hover {

/* Progress bar */

/* =========================

<body>

<div class="page">


  <!-- =====================
       HEADER
  ====================== -->

  <header class="header">

    <div class="logo">
      BPWedding
    </div>

    <div class="line"></div>

    <h1 class="title">
      OUR GALLERY
    </h1>

    <div class="subtitle">
      Our favorite moments together
    </div>

  </header>




  <!-- =====================
       MUSIC
  ====================== -->
  <div class="music-control">
    <div class="music-player-controls">
      <button class="music-skip-button" id="prevSongButton" type="button"
              aria-label="Previous song" title="Previous song">‹ PREV</button>

      <button class="music-button" id="musicButton" type="button">
        ♪ PLAY MUSIC
      </button>

      <button class="music-skip-button" id="nextSongButton" type="button"
              aria-label="Next song" title="Next song">NEXT ›</button>
    </div>
  </div>

  <div class="youtube-audio-player" aria-hidden="true">
    <div id="youtubePlayer"></div>
  </div>

  <!-- =====================
       GALLERY
  ====================== -->

  <main class="slider-wrapper">

    <div
      class="slider"
      id="slider"
    >
      <button
        class="fullscreen-button"
        id="fullscreenButton"
        type="button"
        aria-label="Open fullscreen"
        title="Fullscreen">⛶</button>

        class="slides"
        id="slides">
      </div>

        class="arrow prev"
        id="prev"
        aria-label="Previous photo">
        &#10094;

        class="arrow next"
        id="next"
        aria-label="Next photo">
        &#10095;
      </button>

        class="counter"
        id="counter">
        01 / 20
      </div>
  <div class="gallery-progress" aria-hidden="true">
<div class="gallery-progress-bar" id="galleryProgressBar"></div>
  </div>

    </div>

    <div
      class="dots"
      id="dots">
    </div>

  </main>

       FOOTER
  ====================== -->

    <div class="message">
      #BPUntilTheEndOfTime ♡
    </div>

      class="back-button"
      id="homeButton"
      href="#">
      ← BACK TO HOME
    </a>

  </footer>

<script src="https://www.youtube.com/iframe_api"></script>

<script>
const YOUTUBE_PLAYLIST = [
  "KZIxYD2LWCI",
  "sotnjcMeGdQ",
  "PsF5rZwx9eA",
  "2Vv-BfVoq4g",   // Ed Sheeran - Perfect
  "GxldQ9eX2wo"    // Stephen Sanchez - Until I Found You
];
let currentSongIndex = 0;
const YOUTUBE_VIDEO_ID = YOUTUBE_PLAYLIST[currentSongIndex];
let youtubePlayer;
let musicPlaying = false;
let youtubeReady = false;

const musicButton = document.getElementById("musicButton");
const prevSongButton = document.getElementById("prevSongButton");
const nextSongButton = document.getElementById("nextSongButton");

function playSongAt(index) {
  if (!youtubeReady || !youtubePlayer) return;

  currentSongIndex =
    (index + YOUTUBE_PLAYLIST.length) % YOUTUBE_PLAYLIST.length;

  musicPlaying = true;
  youtubePlayer.loadVideoById(YOUTUBE_PLAYLIST[currentSongIndex]);
}

function nextSong() {
  playSongAt(currentSongIndex + 1);
}

function previousSong() {
  playSongAt(currentSongIndex - 1);
}

function onYouTubeIframeAPIReady() {
  youtubePlayer = new YT.Player("youtubePlayer", {
    height: "200",
    width: "200",
    videoId: YOUTUBE_VIDEO_ID,
    playerVars: {
      autoplay: 0,
      controls: 0,
      disablekb: 1,
      fs: 0,
      playsinline: 1,
      rel: 0,
      loop: 0,
      origin: window.location.origin
    },
    events: {
      onReady: function() {
        youtubeReady = true;
        musicButton.textContent = "♪ PLAY MUSIC  1/" + YOUTUBE_PLAYLIST.length;
      },
      onStateChange: function(event) {
        if (event.data === YT.PlayerState.PLAYING) {
          musicPlaying = true;
          musicButton.textContent =
            "❚❚ PAUSE MUSIC  " + (currentSongIndex + 1) + "/" + YOUTUBE_PLAYLIST.length;
        }

        if (event.data === YT.PlayerState.PAUSED) {
          musicPlaying = false;
          musicButton.textContent =
            "♪ PLAY MUSIC  " + (currentSongIndex + 1) + "/" + YOUTUBE_PLAYLIST.length;
        }

        if (event.data === YT.PlayerState.ENDED) {
          currentSongIndex =
            (currentSongIndex + 1) % YOUTUBE_PLAYLIST.length;
          musicPlaying = true;
          youtubePlayer.loadVideoById(YOUTUBE_PLAYLIST[currentSongIndex]);
        }
      },
      onError: function(event) {
        musicPlaying = false;
        musicButton.textContent = "MUSIC ERROR " + event.data;
        console.error("YouTube Player Error:", event.data);
      },
      onAutoplayBlocked: function() {
        musicPlaying = false;
        musicButton.textContent = "♪ TAP TO PLAY MUSIC";
      }
    }
  });
}

musicButton.addEventListener("click", function() {
  if (!youtubeReady || !youtubePlayer) {
    musicButton.textContent = "MUSIC LOADING...";
    return;
  }
  if (musicPlaying) {
    youtubePlayer.pauseVideo();
  } else {
    youtubePlayer.playVideo();
  }
});

if (prevSongButton) {
  prevSongButton.addEventListener("click", function() {
    if (!youtubeReady || !youtubePlayer) {
      musicButton.textContent = "MUSIC LOADING...";
      return;
    }
    previousSong();
  });
}

if (nextSongButton) {
  nextSongButton.addEventListener("click", function() {
    if (!youtubeReady || !youtubePlayer) {
      musicButton.textContent = "MUSIC LOADING...";
      return;
    }
    nextSong();
  });
}
</script>

<script>

/* ==============================================
   1. รูปภาพ

   เพิ่ม/ลดรูปตรงนี้ได้เลย
============================================== */

const images = [

  "BP01.JPG",
  "BP02.JPG",
  "BP03.JPG",
  "BP04.JPG",
  "BP05.JPG",

  "BP06.JPG",
  "BP07.JPG",
  "BP08.JPG",
  "BP09.JPG",
  "BP10.JPG",

  "BP11.JPG",
  "BP12.JPG",
  "BP13.JPG",
  "BP14.JPG",
  "BP15.JPG",

  "BP16.JPG",
  "BP17.JPG",
  "BP18.JPG",
  "BP19.JPG",
  "BP20.JPG"

];


/* ==============================================
   2. URL เว็บ Canva หลัก
============================================== */

const HOME_URL =
"https://bpuntiltheendoftime.my.canva.site/bpwedding/page-2";


/* ==============================================
   3. Auto Slide

   5000 = 5 วินาที
============================================== */

const AUTO_SLIDE_TIME = 5000;


/*
  เมื่อแขกปัด/กดรูปเอง
  รอ 10 วินาทีแล้วค่อย Auto Slide ต่อ
*/

const RESUME_TIME = 10000;


/* ==============================================
   ELEMENTS
============================================== */

const slider =
document.getElementById("slider");

const slidesContainer =
document.getElementById("slides");

const dotsContainer =
document.getElementById("dots");

const counter =
document.getElementById("counter");

const prev =
document.getElementById("prev");

const next =
document.getElementById("next");

const homeButton =
document.getElementById("homeButton");


homeButton.href =
HOME_URL;


/* ==============================================
   VARIABLES
============================================== */

let currentIndex = 0;

let autoTimer;

let resumeTimer;

let startX = 0;

let startY = 0;

let endX = 0;

let endY = 0;


/* ==============================================
   CREATE SLIDES
============================================== */

images.forEach(
(image, index) => {


  /* Create slide */

  const slide =
  document.createElement("div");

  slide.className =
  "slide";


  /* Create image */

  const img =
  document.createElement("img");

  img.src =
  image;

  img.alt =
  `B & P Wedding Photo ${index + 1}`;


  /*
    รูปแรกโหลดทันที
    รูปอื่น Lazy Load
  */

  if (index === 0) {

    img.loading =
    "eager";

    img.fetchPriority =
    "high";

  }

  else {

    img.loading =
    "lazy";

  }


  slide.appendChild(img);

  slidesContainer.appendChild(slide);



  /* Create dot */

  const dot =
  document.createElement("span");

  dot.className =
  "dot";


  dot.addEventListener(
  "click",
  () => {

    goToSlide(index);

    userInteraction();

  });


  dotsContainer.appendChild(dot);

});


/* ==============================================
   UPDATE
============================================== */

function updateSlider() {

  /* Fade slides */

  const slides =
  document.querySelectorAll(".slide");

  slides.forEach(
  (slide, index) => {

    slide.classList.toggle(
      "active",
      index === currentIndex
    );

  });


  /* Update dots */

  const dots =
  document.querySelectorAll(".dot");


  dots.forEach(
  (dot, index) => {

    dot.classList.toggle(
    "active",
    index === currentIndex
    );

  });


  /* Update counter */

  const current =
  String(currentIndex + 1)
  .padStart(2, "0");


  const total =
  String(images.length)
  .padStart(2, "0");


  counter.textContent =
  `${current} / ${total}`;

  /* Update progress bar */
  const progressBar =
  document.getElementById("galleryProgressBar");

  if (progressBar) {
    progressBar.style.width =
      `${((currentIndex + 1) / images.length) * 100}%`;
  }


  /* Preload */

  preloadNearbyImages();

}


/* ==============================================
   GO TO SLIDE
============================================== */

function goToSlide(index) {

  if (
    index >= images.length
  ) {

    currentIndex = 0;

  }

  else if (
    index < 0
  ) {

    currentIndex =
    images.length - 1;

  }

  else {

    currentIndex =
    index;

  }


  updateSlider();

}


/* ==============================================
   NEXT
============================================== */

function nextSlide() {

  goToSlide(
  currentIndex + 1
  );

}


/* ==============================================
   PREVIOUS
============================================== */

function previousSlide() {

  goToSlide(
  currentIndex - 1
  );

}


/* ==============================================
   BUTTONS
============================================== */

next.addEventListener(
"click",
() => {

  nextSlide();

  userInteraction();

});


prev.addEventListener(
"click",
() => {

  previousSlide();

  userInteraction();

});


/* ==============================================
   AUTO SLIDE
============================================== */

function startAutoSlide() {

  stopAutoSlide();


  autoTimer =
  setInterval(
  nextSlide,
  AUTO_SLIDE_TIME
  );

}


function stopAutoSlide() {

  clearInterval(
  autoTimer
  );

}


/* ==============================================
   USER INTERACTION
============================================== */

function userInteraction() {

  stopAutoSlide();

  clearTimeout(
  resumeTimer
  );


  resumeTimer =
  setTimeout(
  startAutoSlide,
  RESUME_TIME
  );

}


/* ==============================================
   SWIPE
============================================== */

slider.addEventListener(
"touchstart",
event => {

  startX =
  event.changedTouches[0].screenX;

  startY =
  event.changedTouches[0].screenY;

  stopAutoSlide();

},
{ passive: true }
);


slider.addEventListener(
"touchend",
event => {

  endX =
  event.changedTouches[0].screenX;

  endY =
  event.changedTouches[0].screenY;

  handleSwipe();

},
{ passive: true }
);


function handleSwipe() {

  const diffX =
  startX - endX;

  const diffY =
  startY - endY;


  /*
    ต้องเป็นการปัดแนวนอน
    มากกว่าแนวตั้ง
  */

  if (
    Math.abs(diffX)
    >
    Math.abs(diffY)
  ) {


    /*
      Swipe Left
    */

    if (
      diffX > 45
    ) {

      nextSlide();

    }


    /*
      Swipe Right
    */

    else if (
      diffX < -45
    ) {

      previousSlide();

    }

  }


  userInteraction();

}


/* ==============================================
   KEYBOARD
============================================== */

document.addEventListener(
"keydown",
event => {

  if (
    event.key ===
    "ArrowRight"
  ) {

    nextSlide();

    userInteraction();

  }


  if (
    event.key ===
    "ArrowLeft"
  ) {

    previousSlide();

    userInteraction();

  }

});


/* ==============================================
   PRELOAD

   โหลดรูปถัดไปไว้ล่วงหน้า
============================================== */

function preloadNearbyImages() {

  const nextIndex =
  (currentIndex + 1)
  %
  images.length;


  const previousIndex =
  (
    currentIndex
    - 1
    + images.length
  )
  %
  images.length;


  [
    images[nextIndex],
    images[previousIndex]
  ]

  .forEach(
  src => {

    const img =
    new Image();

    img.src =
    src;

  });

}


/* ==============================================
   PAUSE WHEN TAB HIDDEN
============================================== */

document.addEventListener(
"visibilitychange",
() => {

  if (
    document.hidden
  ) {

    stopAutoSlide();

  }

  else {

    startAutoSlide();

  }

});


/* ==============================================
   START
============================================== */

updateSlider();

startAutoSlide();

</script>


<script>
/* =========================
   HYBRID GALLERY FULLSCREEN
   Native: Windows / Android / iPad where supported
   Viewer fallback: iPhone
========================= */
const fullscreenButton = document.getElementById("fullscreenButton");
const fullscreenGallery = document.getElementById("slider");

let iosViewerMode = false;

function isIPhone() {
  return /iPhone|iPod/i.test(navigator.userAgent);
}

function setFullscreenButton(isFullscreen) {
  if (!fullscreenButton) return;
  fullscreenButton.textContent = isFullscreen ? "×" : "⛶";
  fullscreenButton.setAttribute(
    "aria-label",
    isFullscreen ? "Exit fullscreen" : "Open fullscreen"
  );
  fullscreenButton.title =
    isFullscreen ? "Exit fullscreen" : "Fullscreen";
}

function enterIOSViewer() {
  iosViewerMode = true;
  document.documentElement.classList.add("ios-gallery-viewer");
  document.body.classList.add("ios-gallery-viewer");
  setFullscreenButton(true);

  /* Scroll to top to encourage Safari's compact browser chrome */
  window.scrollTo(0, 1);
}

function exitIOSViewer() {
  iosViewerMode = false;
  document.documentElement.classList.remove("ios-gallery-viewer");
  document.body.classList.remove("ios-gallery-viewer");
  setFullscreenButton(false);
}

async function toggleGalleryFullscreen() {
  if (!fullscreenGallery) return;

  /* iPhone: use dedicated viewport-filling viewer */
  if (isIPhone()) {
    if (iosViewerMode) {
      exitIOSViewer();
    } else {
      enterIOSViewer();
    }
    return;
  }

  /* Other supported browsers: native fullscreen */
  try {
    if (document.fullscreenElement) {
      await document.exitFullscreen();
      return;
    }

    if (fullscreenGallery.requestFullscreen) {
      await fullscreenGallery.requestFullscreen({
        navigationUI: "hide"
      });
      return;
    }
  } catch (err) {
    console.warn("Native fullscreen unavailable; using viewer mode.", err);
  }

  /* Generic fallback if native fullscreen is blocked */
  if (iosViewerMode) {
    exitIOSViewer();
  } else {
    enterIOSViewer();
  }
}

if (fullscreenButton) {
  fullscreenButton.addEventListener("click", toggleGalleryFullscreen);
}

document.addEventListener("fullscreenchange", function () {
  if (!iosViewerMode) {
    setFullscreenButton(document.fullscreenElement === fullscreenGallery);
  }
});

document.addEventListener("fullscreenerror", function (event) {
  console.error("Fullscreen API error:", event);
});

document.addEventListener("keydown", function(event) {
  if (event.key === "Escape" && iosViewerMode) {
    exitIOSViewer();
  }
});
</script>
