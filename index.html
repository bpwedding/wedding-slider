<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BPWedding Website | Our Gallery</title>

<style>
/* =========================
   GENERAL
========================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  scroll-behavior: smooth;
}

body {
  margin: 0;
  padding: 0;

  background: #faf8f5;
  color: #403a36;

  font-family: Georgia, "Times New Roman", serif;

  min-height: 100vh;
}


/* =========================
   PAGE
========================= */

.page {
  width: 100%;
  max-width: 1000px;

  margin: auto;

  padding:
    45px
    20px
    35px;
}


/* =========================
   HEADER
========================= */

.header {
  text-align: center;

  margin-bottom: 28px;
}

.logo {
  font-size: 38px;

  font-style: italic;

  letter-spacing: 3px;

  margin-bottom: 8px;
}

.line {
  width: 55px;
  height: 1px;

  background: #a69b91;

  margin:
    12px
    auto
    18px;
}

.title {
  font-size: 18px;

  letter-spacing: 6px;

  font-weight: normal;

  margin: 0;
}

.subtitle {
  margin-top: 12px;

  font-family: Arial, sans-serif;

  font-size: 13px;

  letter-spacing: 1px;

  color: #888078;
}


/* =========================
   SLIDER
========================= */

.slider-wrapper {
  width: 100%;

  max-width: 900px;

  margin: auto;

  position: relative;
}

.slider {
  position: relative;

  width: 100%;

  /*
    เปลี่ยนตรงนี้ได้
    16 / 10 = ค่อนข้างเหมาะกับรูป Wedding
  */

  aspect-ratio: 16 / 10;

  overflow: hidden;

  background: #eeeae5;

  border-radius: 4px;

  box-shadow:
    0 8px 30px
    rgba(0,0,0,0.08);

  touch-action: pan-y;

  user-select: none;
}


/* =========================
   SLIDES
========================= */

.slides {
  width: 100%;
  height: 100%;

  display: flex;

  transition:
    transform
    0.55s
    cubic-bezier(.4,0,.2,1);
}

.slide {
  flex:
    0 0
    100%;

  width: 100%;
  height: 100%;

  display: flex;

  align-items: center;
  justify-content: center;
}

.slide img {
  width: 100%;
  height: 100%;

  object-fit: contain;

  display: block;

  pointer-events: none;

  -webkit-user-drag: none;
}


/* =========================
   ARROWS
========================= */

.arrow {
  position: absolute;

  top: 50%;

  transform:
    translateY(-50%);

  width: 45px;
  height: 45px;

  border: 0;

  border-radius: 50%;

  background:
    rgba(0,0,0,0.28);

  color: white;

  font-size: 24px;

  cursor: pointer;

  display: flex;

  align-items: center;
  justify-content: center;

  z-index: 10;

  transition:
    background 0.2s ease,
    transform 0.2s ease;
}

.arrow:hover {
  background:
    rgba(0,0,0,0.5);
}

.arrow:active {
  transform:
    translateY(-50%)
    scale(0.92);
}

.prev {
  left: 15px;
}

.next {
  right: 15px;
}


/* =========================
   COUNTER
========================= */

.counter {
  position: absolute;

  top: 15px;
  right: 15px;

  padding:
    6px
    11px;

  border-radius: 20px;

  background:
    rgba(0,0,0,0.30);

  color: white;

  font-family:
    Arial,
    sans-serif;

  font-size: 12px;

  letter-spacing: 1px;

  z-index: 10;
}


/* =========================
   DOTS
========================= */

.dots {
  display: flex;

  justify-content: center;

  align-items: center;

  flex-wrap: wrap;

  gap: 7px;

  margin-top: 18px;
}

.dot {
  width: 7px;
  height: 7px;

  border-radius: 50%;

  background: #d2cbc4;

  cursor: pointer;

  transition:
    all
    0.25s ease;
}

.dot.active {
  background: #514a44;

  transform:
    scale(1.4);
}


/* =========================
   FOOTER
========================= */

.footer {
  text-align: center;

  margin-top: 32px;
}

.message {
  font-style: italic;

  font-size: 15px;

  color: #7b7169;

  margin-bottom: 25px;
}


/* =========================
   BACK BUTTON
========================= */

.back-button {
  display: inline-block;

  padding:
    12px
    24px;

  border:
    1px solid
    #837970;

  color: #514a44;

  text-decoration: none;

  font-family:
    Arial,
    sans-serif;

  font-size: 11px;

  letter-spacing: 2px;

  transition:
    all
    0.25s ease;
}

.back-button:hover {
  background: #514a44;

  color: white;
}



/* =========================
   MUSIC
========================= */

.music-control {
  text-align: center;
  margin: 0 0 22px;
}

.music-button {
  padding: 10px 18px;
  border: 1px solid #837970;
  background: rgba(250,248,245,0.92);
  color: #514a44;
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  cursor: pointer;
  transition: all 0.25s ease;
}

.music-button:hover {
  background: #514a44;
  color: white;
}

.music-button:disabled {
  opacity: 0.55;
  cursor: default;
}

.youtube-audio-player {
  position: fixed;
  width: 1px;
  height: 1px;
  left: -9999px;
  top: -9999px;
  overflow: hidden;
}

/* =========================
   MOBILE
========================= */

@media
(max-width: 600px) {

  .page {
    padding:
      30px
      12px
      25px;
  }

  .logo {
    font-size: 31px;
  }

  .title {
    font-size: 15px;

    letter-spacing: 4px;
  }

  .subtitle {
    font-size: 11px;
  }

  .slider {
    /*
      มือถือให้รูปใหญ่ขึ้น
    */

    aspect-ratio: 4 / 5;
  }

  .arrow {
    width: 38px;
    height: 38px;

    font-size: 20px;
  }

  .prev {
    left: 8px;
  }

  .next {
    right: 8px;
  }

  .counter {
    top: 10px;
    right: 10px;
  }

}

</style>
</head>


<body>

<div class="page">


  <!-- =====================
       HEADER
  ====================== -->

  <header class="header">

    <div class="logo">
      BPWedding
    </div>

    <div class="line"></div>

    <h1 class="title">
      OUR GALLERY
    </h1>

    <div class="subtitle">
      Our favorite moments together
    </div>

  </header>




  <!-- =====================
       MUSIC
  ====================== -->

  <div class="music-control">
    <button
      class="music-button"
      id="musicButton"
      type="button">
      ♪ PLAY MUSIC
    </button>
  </div>

  <!-- YouTube player is kept off-screen; playback starts only after a user click/tap. -->
  <div class="youtube-audio-player" aria-hidden="true">
    <div id="youtubePlayer"></div>
  </div>


  <!-- =====================
       GALLERY
  ====================== -->

  <main class="slider-wrapper">

    <div
      class="slider"
      id="slider"
    >

      <div
        class="slides"
        id="slides">
      </div>


      <!-- Previous -->

      <button
        class="arrow prev"
        id="prev"
        aria-label="Previous photo">
        &#10094;
      </button>


      <!-- Next -->

      <button
        class="arrow next"
        id="next"
        aria-label="Next photo">
        &#10095;
      </button>


      <!-- Counter -->

      <div
        class="counter"
        id="counter">
        01 / 20
      </div>

    </div>


    <!-- Dots -->

    <div
      class="dots"
      id="dots">
    </div>

  </main>



  <!-- =====================
       FOOTER
  ====================== -->

  <footer class="footer">

    <div class="message">
      #BPUntilTheEndOfTime ♡
    </div>

    <a
      class="back-button"
      id="homeButton"
      href="#">
      ← BACK TO HOME
    </a>

  </footer>

</div>



<script src="https://www.youtube.com/iframe_api"></script>

<script>

/* ==============================================
   0. MUSIC

   ใส่ YouTube Video ID ตรง YOUTUBE_VIDEO_ID
   ตัวอย่าง:
   https://www.youtube.com/watch?v=dQw4w9WgXcQ
   Video ID คือ dQw4w9WgXcQ
============================================== */

const YOUTUBE_VIDEO_ID = "KZIxYD2LWCI";

let youtubePlayer;
let musicPlaying = false;
let youtubeReady = false;

const musicButton =
document.getElementById("musicButton");

function onYouTubeIframeAPIReady() {

  if (
    !YOUTUBE_VIDEO_ID ||
    YOUTUBE_VIDEO_ID === "PUT_YOUTUBE_VIDEO_ID_HERE"
  ) {
    musicButton.textContent = "♪ ADD YOUTUBE SONG";
    musicButton.disabled = true;
    return;
  }

  youtubePlayer = new YT.Player(
    "youtubePlayer",
    {
      height: "1",
      width: "1",
      videoId: YOUTUBE_VIDEO_ID,

      playerVars: {
        autoplay: 0,
        controls: 0,
        disablekb: 1,
        fs: 0,
        playsinline: 1,
        rel: 0,
        loop: 1,
        playlist: YOUTUBE_VIDEO_ID
      },

      events: {

        onReady: function() {
          youtubeReady = true;
        },

        onStateChange: function(event) {

          if (event.data === YT.PlayerState.PLAYING) {
            musicPlaying = true;
            musicButton.textContent = "❚❚ PAUSE MUSIC";
          }

          if (
            event.data === YT.PlayerState.PAUSED ||
            event.data === YT.PlayerState.ENDED
          ) {
            musicPlaying = false;
            musicButton.textContent = "♪ PLAY MUSIC";
          }
        },

        onError: function() {
          musicPlaying = false;
          musicButton.textContent = "MUSIC UNAVAILABLE";
          musicButton.disabled = true;
        }
      }
    }
  );
}

musicButton.addEventListener(
  "click",
  function() {

    if (!youtubeReady || !youtubePlayer) {
      return;
    }

    if (musicPlaying) {
      youtubePlayer.pauseVideo();
    }
    else {
      youtubePlayer.playVideo();
    }
  }
);


/* ==============================================
   1. รูปภาพ

   เพิ่ม/ลดรูปตรงนี้ได้เลย
============================================== */

const images = [

  "BP01.JPG",
  "BP02.JPG",
  "BP03.JPG",
  "BP04.JPG",
  "BP05.JPG",

  "BP06.JPG",
  "BP07.JPG",
  "BP08.JPG",
  "BP09.JPG",
  "BP10.JPG",

  "BP11.JPG",
  "BP12.JPG",
  "BP13.JPG",
  "BP14.JPG",
  "BP15.JPG",

  "BP16.JPG",
  "BP17.JPG",
  "BP18.JPG",
  "BP19.JPG",
  "BP20.JPG"

];


/* ==============================================
   2. URL เว็บ Canva หลัก
============================================== */

const HOME_URL =
"https://bpuntiltheendoftime.my.canva.site/bpwedding/page-2";


/* ==============================================
   3. Auto Slide

   5000 = 5 วินาที
============================================== */

const AUTO_SLIDE_TIME = 5000;


/*
  เมื่อแขกปัด/กดรูปเอง
  รอ 10 วินาทีแล้วค่อย Auto Slide ต่อ
*/

const RESUME_TIME = 10000;


/* ==============================================
   ELEMENTS
============================================== */

const slider =
document.getElementById("slider");

const slidesContainer =
document.getElementById("slides");

const dotsContainer =
document.getElementById("dots");

const counter =
document.getElementById("counter");

const prev =
document.getElementById("prev");

const next =
document.getElementById("next");

const homeButton =
document.getElementById("homeButton");


homeButton.href =
HOME_URL;


/* ==============================================
   VARIABLES
============================================== */

let currentIndex = 0;

let autoTimer;

let resumeTimer;

let startX = 0;

let startY = 0;

let endX = 0;

let endY = 0;


/* ==============================================
   CREATE SLIDES
============================================== */

images.forEach(
(image, index) => {


  /* Create slide */

  const slide =
  document.createElement("div");

  slide.className =
  "slide";


  /* Create image */

  const img =
  document.createElement("img");

  img.src =
  image;

  img.alt =
  `B & P Wedding Photo ${index + 1}`;


  /*
    รูปแรกโหลดทันที
    รูปอื่น Lazy Load
  */

  if (index === 0) {

    img.loading =
    "eager";

    img.fetchPriority =
    "high";

  }

  else {

    img.loading =
    "lazy";

  }


  slide.appendChild(img);

  slidesContainer.appendChild(slide);



  /* Create dot */

  const dot =
  document.createElement("span");

  dot.className =
  "dot";


  dot.addEventListener(
  "click",
  () => {

    goToSlide(index);

    userInteraction();

  });


  dotsContainer.appendChild(dot);

});


/* ==============================================
   UPDATE
============================================== */

function updateSlider() {


  /* Move slides */

  slidesContainer.style.transform =
  `translateX(-${currentIndex * 100}%)`;


  /* Update dots */

  const dots =
  document.querySelectorAll(".dot");


  dots.forEach(
  (dot, index) => {

    dot.classList.toggle(
    "active",
    index === currentIndex
    );

  });


  /* Update counter */

  const current =
  String(currentIndex + 1)
  .padStart(2, "0");


  const total =
  String(images.length)
  .padStart(2, "0");


  counter.textContent =
  `${current} / ${total}`;


  /* Preload */

  preloadNearbyImages();

}


/* ==============================================
   GO TO SLIDE
============================================== */

function goToSlide(index) {

  if (
    index >= images.length
  ) {

    currentIndex = 0;

  }

  else if (
    index < 0
  ) {

    currentIndex =
    images.length - 1;

  }

  else {

    currentIndex =
    index;

  }


  updateSlider();

}


/* ==============================================
   NEXT
============================================== */

function nextSlide() {

  goToSlide(
  currentIndex + 1
  );

}


/* ==============================================
   PREVIOUS
============================================== */

function previousSlide() {

  goToSlide(
  currentIndex - 1
  );

}


/* ==============================================
   BUTTONS
============================================== */

next.addEventListener(
"click",
() => {

  nextSlide();

  userInteraction();

});


prev.addEventListener(
"click",
() => {

  previousSlide();

  userInteraction();

});


/* ==============================================
   AUTO SLIDE
============================================== */

function startAutoSlide() {

  stopAutoSlide();


  autoTimer =
  setInterval(
  nextSlide,
  AUTO_SLIDE_TIME
  );

}


function stopAutoSlide() {

  clearInterval(
  autoTimer
  );

}


/* ==============================================
   USER INTERACTION
============================================== */

function userInteraction() {

  stopAutoSlide();

  clearTimeout(
  resumeTimer
  );


  resumeTimer =
  setTimeout(
  startAutoSlide,
  RESUME_TIME
  );

}


/* ==============================================
   SWIPE
============================================== */

slider.addEventListener(
"touchstart",
event => {

  startX =
  event.changedTouches[0].screenX;

  startY =
  event.changedTouches[0].screenY;

  stopAutoSlide();

},
{ passive: true }
);


slider.addEventListener(
"touchend",
event => {

  endX =
  event.changedTouches[0].screenX;

  endY =
  event.changedTouches[0].screenY;

  handleSwipe();

},
{ passive: true }
);


function handleSwipe() {

  const diffX =
  startX - endX;

  const diffY =
  startY - endY;


  /*
    ต้องเป็นการปัดแนวนอน
    มากกว่าแนวตั้ง
  */

  if (
    Math.abs(diffX)
    >
    Math.abs(diffY)
  ) {


    /*
      Swipe Left
    */

    if (
      diffX > 45
    ) {

      nextSlide();

    }


    /*
      Swipe Right
    */

    else if (
      diffX < -45
    ) {

      previousSlide();

    }

  }


  userInteraction();

}


/* ==============================================
   KEYBOARD
============================================== */

document.addEventListener(
"keydown",
event => {

  if (
    event.key ===
    "ArrowRight"
  ) {

    nextSlide();

    userInteraction();

  }


  if (
    event.key ===
    "ArrowLeft"
  ) {

    previousSlide();

    userInteraction();

  }

});


/* ==============================================
   PRELOAD

   โหลดรูปถัดไปไว้ล่วงหน้า
============================================== */

function preloadNearbyImages() {

  const nextIndex =
  (currentIndex + 1)
  %
  images.length;


  const previousIndex =
  (
    currentIndex
    - 1
    + images.length
  )
  %
  images.length;


  [
    images[nextIndex],
    images[previousIndex]
  ]

  .forEach(
  src => {

    const img =
    new Image();

    img.src =
    src;

  });

}


/* ==============================================
   PAUSE WHEN TAB HIDDEN
============================================== */

document.addEventListener(
"visibilitychange",
() => {

  if (
    document.hidden
  ) {

    stopAutoSlide();

  }

  else {

    startAutoSlide();

  }

});


/* ==============================================
   START
============================================== */

updateSlider();

startAutoSlide();

</script>

</body>
</html>
